version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm install --global pnpm@11.25.0
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - node scripts/amplify-env.mjs
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
      - .next/cache/**/*
